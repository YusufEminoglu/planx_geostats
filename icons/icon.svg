<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" shape-rendering="geometricPrecision">

  <defs>
    <linearGradient id="BG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8a85"></stop>
      <stop offset="1" stop-color="#0c3a37"></stop>
    </linearGradient>
    <radialGradient id="GL" cx="30%" cy="22%" r="75%">
      <stop offset="0" stop-color="#7fd9d2" stop-opacity="0.32"></stop>
      <stop offset="1" stop-color="#7fd9d2" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#BG)"></rect>
  <rect width="512" height="512" rx="104" fill="url(#GL)"></rect>

  <!-- spatial-weights network glyph: one dominant center node, four neighbors -->
  <g stroke="#f7f0de" stroke-width="16" stroke-linecap="round">
    <line x1="210" y1="230" x2="110" y2="140"></line>
    <line x1="210" y1="230" x2="310" y2="120"></line>
    <line x1="210" y1="230" x2="340" y2="260"></line>
    <line x1="210" y1="230" x2="130" y2="320"></line>
  </g>

  <circle cx="110" cy="140" r="26" fill="#f7f0de" stroke="#142826" stroke-width="9"></circle>
  <circle cx="310" cy="120" r="26" fill="#f7f0de" stroke="#142826" stroke-width="9"></circle>
  <circle cx="340" cy="260" r="26" fill="#f7f0de" stroke="#142826" stroke-width="9"></circle>
  <circle cx="130" cy="320" r="26" fill="#f7f0de" stroke="#142826" stroke-width="9"></circle>
  <circle cx="210" cy="230" r="46" fill="#e88d3a" stroke="#142826" stroke-width="9"></circle>

  <!-- bar-chart accent -->
  <g stroke="#142826" stroke-linejoin="round" stroke-width="6">
    <rect x="354" y="418" width="30" height="50" fill="#f7f0de"></rect>
    <rect x="398" y="390" width="30" height="78" fill="#96dccf"></rect>
    <rect x="442" y="358" width="30" height="110" fill="#e88d3a"></rect>
  </g>
  <path d="M346 468 H480" stroke="#f7f0de" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"></path>
</svg>
